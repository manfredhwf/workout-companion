<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout tracker</title>
<meta name="description" content="Build workouts and see exactly which exercise to do next at the gym.">
<meta name="theme-color" content="#15130e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    background: #15130e;
    min-height: 100vh;
  }
<style>
  #wl-root {
    --ink: #15130e;
    --surface: #1e1b15;
    --surface2: #262218;
    --chalk: #f1ead9;
    --muted: #a79c87;
    --brass: #d6a73b;
    --brass-dim: #7a5a18;
    --rust: #c15334;
    --green: #7aa661;
    --line: #34301f;
    background: var(--ink);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    padding: 28px 22px 40px;
    border-radius: 14px;
    max-width: 720px;
    margin: 0 auto;
  }
  #wl-root * { box-sizing: border-box; }
  .wl-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 4px;
  }
  .wl-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 30px;
    margin: 0 0 22px;
    color: var(--chalk);
  }
  .wl-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 20px;
    margin-bottom: 18px;
  }
  .wl-section-label {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wl-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .wl-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .wl-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 90px; }
  .wl-field label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.03em;
  }
  .wl-field input, .wl-field textarea {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    outline: none;
    width: 100%;
  }
  .wl-field input:focus, .wl-field textarea:focus { border-color: var(--brass); }
  .wl-field.wl-num input {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
  }
  .wl-exercise {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 12px 4px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.015);
    position: relative;
  }
  .wl-exercise-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--brass-dim);
    position: absolute;
    top: 10px;
    right: 12px;
  }
  .wl-remove-ex {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    padding: 6px 0 2px;
  }
  .wl-remove-ex:hover { color: var(--rust); }
  .wl-ex-video {
    width: 128px;
    height: 72px;
    flex-shrink: 0;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--line);
  }
  .wl-ex-video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .wl-ex-video-lg { width: 160px; height: 90px; }
  .wl-video-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--brass);
    text-decoration: none;
  }
  .wl-video-fallback:hover { background: rgba(214,167,59,0.08); }
  .wl-btn {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--chalk);
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .wl-btn:hover { border-color: var(--brass); }
  .wl-btn:active { transform: scale(0.97); }
  .wl-btn-primary {
    background: var(--brass);
    color: #241a05;
    border-color: var(--brass);
  }
  .wl-btn-primary:hover { border-color: var(--brass); filter: brightness(1.06); }
  .wl-btn-ghost { background: none; }
  .wl-btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .wl-btn-row.wl-end { justify-content: flex-end; margin-top: 16px; }

  .wl-entries-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .wl-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .wl-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 10px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .wl-entry {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    background: var(--surface);
  }
  .wl-entry-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .wl-stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    border-radius: 5px;
    padding: 5px 8px;
    white-space: nowrap;
    transform: rotate(-2deg);
    flex-shrink: 0;
  }
  .wl-stamp.wl-stamp-done {
    color: var(--green);
    border-color: var(--green);
  }
  .wl-entry-main { flex: 1; min-width: 0; }
  .wl-entry-title {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    letter-spacing: 0.01em;
    margin: 0 0 3px;
    color: var(--chalk);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wl-entry-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wl-chevron {
    font-size: 18px;
    color: var(--muted);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .wl-entry.wl-open .wl-chevron { transform: rotate(90deg); color: var(--brass); }
  .wl-entry-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--line);
  }
  .wl-entry.wl-open .wl-entry-body { display: block; padding-top: 14px; }
  .wl-next-banner {
    background: var(--surface2);
    border: 1px solid var(--brass-dim);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .wl-next-text { flex: 1; min-width: 0; }
  .wl-next-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 3px;
  }
  .wl-next-name {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    color: var(--chalk);
    margin: 0;
  }
  .wl-next-data {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .wl-ex-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .wl-ex-line:last-of-type { border-bottom: none; }
  .wl-ex-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .wl-ex-check {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid var(--brass-dim);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 12px;
  }
  .wl-ex-line.wl-done .wl-ex-check {
    background: var(--green);
    border-color: var(--green);
  }
  .wl-ex-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .wl-ex-name {
    color: var(--chalk);
    display: block;
  }
  .wl-ex-line.wl-done .wl-ex-name {
    color: var(--muted);
    text-decoration: line-through;
  }
  .wl-ex-data {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--brass);
    font-size: 13px;
    white-space: nowrap;
  }
  .wl-ex-line.wl-done .wl-ex-data { color: var(--muted); }
  .wl-notes {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .wl-entry-actions {
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    margin-top: 14px;
  }
  .wl-delete, .wl-reset {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
  }
  .wl-delete:hover { color: var(--rust); }
  .wl-reset:hover { color: var(--brass); }
  .wl-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    padding: 20px 0;
    text-align: center;
  }
</style>

</head>
<body>
<div id="wl-root">
  <p class="wl-eyebrow">At the gym</p>
  <h1 class="wl-title">Workout tracker</h1>

  <div class="wl-card">
    <p class="wl-section-label">Build a workout</p>
    <div class="wl-row">
      <div class="wl-field">
        <label for="wl-title">Workout name</label>
        <input id="wl-title" type="text" placeholder="Upper body, leg day, 5k run..." />
      </div>
    </div>

    <p class="wl-section-label" style="margin-top: 18px;">Exercises</p>
    <div id="wl-exercise-list"></div>
    <div class="wl-btn-row">
      <button class="wl-btn wl-btn-ghost" id="wl-add-exercise" type="button">+ Add exercise</button>
    </div>

    <div class="wl-row" style="margin-top: 16px;">
      <div class="wl-field">
        <label for="wl-notes">Notes</label>
        <textarea id="wl-notes" rows="2" placeholder="How it felt, anything to remember..."></textarea>
      </div>
    </div>

    <div class="wl-btn-row wl-end">
      <button class="wl-btn wl-btn-primary" id="wl-save" type="button">Save workout</button>
    </div>
  </div>

  <div class="wl-card">
    <div class="wl-entries-head">
      <p class="wl-section-label" style="margin: 0; flex: 1;">Your workouts</p>
      <span class="wl-count" id="wl-count"></span>
    </div>
    <div id="wl-entries"></div>
  </div>
</div>

<script>
  // Local storage shim standing in for Claude's window.storage API,
  // so the app's save/load code below works unchanged.
  (function () {
    const PREFIX = 'wl:';
    window.storage = {
      async get(key) {
        try {
          const raw = localStorage.getItem(PREFIX + key);
          if (raw === null) return null;
          return { key, value: raw, shared: false };
        } catch (e) {
          console.error('storage.get failed', e);
          return null;
        }
      },
      async set(key, value) {
        try {
          localStorage.setItem(PREFIX + key, value);
          return { key, value, shared: false };
        } catch (e) {
          console.error('storage.set failed', e);
          return null;
        }
      },
      async delete(key) {
        try {
          localStorage.removeItem(PREFIX + key);
          return { key, deleted: true, shared: false };
        } catch (e) {
          console.error('storage.delete failed', e);
          return null;
        }
      },
      async list(prefix) {
        try {
          const full = PREFIX + (prefix || '');
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(full) === 0) keys.push(k.slice(PREFIX.length));
          }
          return { keys, prefix: prefix || undefined, shared: false };
        } catch (e) {
          console.error('storage.list failed', e);
          return null;
        }
      },
    };
  })();
</script>

<script>
(function () {
  const exerciseListEl = document.getElementById('wl-exercise-list');
  const entriesEl = document.getElementById('wl-entries');
  const countEl = document.getElementById('wl-count');

  let exerciseRowCount = 0;
  let openEntryId = null;

  function addExerciseRow(prefill) {
    exerciseRowCount++;
    const wrap = document.createElement('div');
    wrap.className = 'wl-exercise';
    wrap.innerHTML = `
      <span class="wl-exercise-num">#${exerciseRowCount}</span>
      <div class="wl-row">
        <div class="wl-field" style="flex: 2;">
          <label>Name</label>
          <input type="text" class="wl-ex-name-input" placeholder="Bench press" value="${prefill && prefill.name ? escapeAttr(prefill.name) : ''}" />
        </div>
      </div>
      <div class="wl-row">
        <div class="wl-field" style="flex: 2;">
          <label>Video link (optional)</label>
          <input type="text" class="wl-ex-video-input" placeholder="Paste a link showing how it's done" value="${prefill && prefill.videoUrl ? escapeAttr(prefill.videoUrl) : ''}" />
        </div>
      </div>
      <div class="wl-row">
        <div class="wl-field wl-num">
          <label>Sets</label>
          <input type="number" min="0" class="wl-ex-sets-input" value="${prefill && prefill.sets != null ? prefill.sets : ''}" />
        </div>
        <div class="wl-field wl-num">
          <label>Reps</label>
          <input type="number" min="0" class="wl-ex-reps-input" value="${prefill && prefill.reps != null ? prefill.reps : ''}" />
        </div>
        <div class="wl-field wl-num">
          <label>Weight (lb)</label>
          <input type="number" min="0" step="0.5" class="wl-ex-weight-input" value="${prefill && prefill.weight != null ? prefill.weight : ''}" />
        </div>
      </div>
      <button type="button" class="wl-remove-ex">Remove</button>
    `;
    wrap.querySelector('.wl-remove-ex').addEventListener('click', () => wrap.remove());
    exerciseListEl.appendChild(wrap);
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;');
  }
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function normalizeUrl(url) {
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) return 'https://' + url;
    return url;
  }

  function getEmbedUrl(rawUrl) {
    const url = normalizeUrl(rawUrl);
    if (!url) return null;
    let u;
    try {
      u = new URL(url);
    } catch (e) {
      return null;
    }
    const host = u.hostname.replace(/^www\.|^m\./, '');
    if (host === 'youtube.com') {
      if (u.pathname === '/watch') {
        const id = u.searchParams.get('v');
        return id ? `https://www.youtube.com/embed/${id}` : null;
      }
      if (u.pathname.startsWith('/shorts/')) {
        const id = u.pathname.split('/')[2];
        return id ? `https://www.youtube.com/embed/${id}` : null;
      }
      if (u.pathname.startsWith('/embed/')) return url;
      return null;
    }
    if (host === 'youtu.be') {
      const id = u.pathname.slice(1);
      return id ? `https://www.youtube.com/embed/${id}` : null;
    }
    if (host === 'vimeo.com') {
      const id = u.pathname.split('/').filter(Boolean)[0];
      return id && /^\d+$/.test(id) ? `https://player.vimeo.com/video/${id}` : null;
    }
    return null;
  }

  function renderVideoBox(rawUrl, large) {
    if (!rawUrl) return '';
    const sizeCls = large ? 'wl-ex-video wl-ex-video-lg' : 'wl-ex-video';
    const embed = getEmbedUrl(rawUrl);
    if (embed) {
      return `<div class="${sizeCls}" onclick="event.stopPropagation()"><iframe src="${escapeAttr(embed)}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="Exercise demo"></iframe></div>`;
    }
    return `<a class="${sizeCls} wl-video-fallback" href="${escapeAttr(normalizeUrl(rawUrl))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Watch \u2197</a>`;
  }

  document.getElementById('wl-add-exercise').addEventListener('click', () => addExerciseRow());
  addExerciseRow();

  function readExercisesFromForm() {
    const rows = exerciseListEl.querySelectorAll('.wl-exercise');
    const exercises = [];
    rows.forEach((row) => {
      const name = row.querySelector('.wl-ex-name-input').value.trim();
      const sets = row.querySelector('.wl-ex-sets-input').value;
      const reps = row.querySelector('.wl-ex-reps-input').value;
      const weight = row.querySelector('.wl-ex-weight-input').value;
      const videoUrl = row.querySelector('.wl-ex-video-input').value.trim();
      if (name || sets || reps || weight || videoUrl) {
        exercises.push({
          name: name || 'Untitled exercise',
          sets: sets === '' ? null : Number(sets),
          reps: reps === '' ? null : Number(reps),
          weight: weight === '' ? null : Number(weight),
          videoUrl: videoUrl || null,
          done: false,
        });
      }
    });
    return exercises;
  }

  function formatExerciseLine(ex) {
    const parts = [];
    if (ex.sets != null) parts.push(ex.sets + (ex.sets === 1 ? ' set' : ' sets'));
    if (ex.reps != null) parts.push(ex.reps + ' reps');
    if (ex.weight != null) parts.push(ex.weight + ' lb');
    return parts.length ? parts.join(' \u00b7 ') : '\u2014';
  }

  async function saveWorkout() {
    const title = document.getElementById('wl-title').value.trim();
    const notes = document.getElementById('wl-notes').value.trim();
    const exercises = readExercisesFromForm();

    if (!title && exercises.length === 0) {
      flashStatus('Add a workout name or at least one exercise first.');
      return;
    }

    const id = 'workout:' + Date.now();
    const entry = {
      id,
      title: title || 'Untitled workout',
      notes,
      exercises,
      createdAt: new Date().toISOString(),
    };

    const saveBtn = document.getElementById('wl-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    try {
      const result = await window.storage.set(id, JSON.stringify(entry));
      if (!result) throw new Error('No result from storage');
      document.getElementById('wl-title').value = '';
      document.getElementById('wl-notes').value = '';
      exerciseListEl.innerHTML = '';
      exerciseRowCount = 0;
      addExerciseRow();
      await loadEntries();
    } catch (err) {
      console.error('Failed to save workout', err);
      flashStatus('Could not save that workout. Try again.');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save workout';
    }
  }

  function flashStatus(msg) {
    const prev = entriesEl.innerHTML;
    entriesEl.innerHTML = `<div class="wl-status">${escapeHtml(msg)}</div>` + prev;
    setTimeout(() => {
      const status = entriesEl.querySelector('.wl-status');
      if (status) status.remove();
    }, 2500);
  }

  async function deleteWorkout(id) {
    try {
      await window.storage.delete(id);
      await loadEntries();
    } catch (err) {
      console.error('Failed to delete workout', err);
    }
  }

  async function persistEntry(entry) {
    try {
      await window.storage.set(entry.id, JSON.stringify(entry));
    } catch (err) {
      console.error('Failed to update workout', err);
    }
  }

  function toggleExercise(entry, index) {
    entry.exercises[index].done = !entry.exercises[index].done;
    persistEntry(entry);
    renderEntries(currentEntries);
  }

  function resetChecklist(entry) {
    entry.exercises.forEach((ex) => { ex.done = false; });
    persistEntry(entry);
    renderEntries(currentEntries);
  }

  let currentEntries = [];

  function renderEntries(entries) {
    currentEntries = entries;
    countEl.textContent = entries.length ? entries.length + (entries.length === 1 ? ' workout' : ' workouts') : '';

    if (entries.length === 0) {
      entriesEl.innerHTML = '<div class="wl-empty">No workouts yet. Build one above.</div>';
      return;
    }

    entries.sort((a, b) => b.createdAt.localeCompare(a.createdAt));

    entriesEl.innerHTML = entries.map((entry) => {
      const isOpen = entry.id === openEntryId;
      const total = entry.exercises.length;
      const doneCount = entry.exercises.filter((ex) => ex.done).length;
      const allDone = total > 0 && doneCount === total;
      const nextEx = entry.exercises.find((ex) => !ex.done);

      const subLine = total
        ? (allDone ? 'All done' : `Up next: ${nextEx.name}`)
        : (entry.notes ? 'Notes only' : 'No exercises yet');

      const stampText = total ? `${doneCount}/${total}` : '\u2014';

      const nextBanner = (total && !allDone) ? `
        <div class="wl-next-banner">
          <div class="wl-next-text">
            <p class="wl-next-label">Up next</p>
            <p class="wl-next-name">${escapeHtml(nextEx.name)}</p>
            <p class="wl-next-data">${escapeHtml(formatExerciseLine(nextEx))}</p>
          </div>
          ${renderVideoBox(nextEx.videoUrl, true)}
        </div>
      ` : (allDone ? `
        <div class="wl-next-banner">
          <div class="wl-next-text">
            <p class="wl-next-label">Workout complete</p>
            <p class="wl-next-name">Nice work</p>
          </div>
        </div>
      ` : '');

      const exerciseLines = entry.exercises.map((ex, i) => `
        <div class="wl-ex-line ${ex.done ? 'wl-done' : ''}">
          <div class="wl-ex-left" data-toggle-ex="${i}">
            <span class="wl-ex-check">${ex.done ? '\u2713' : ''}</span>
            <div class="wl-ex-text">
              <span class="wl-ex-name">${escapeHtml(ex.name)}</span>
              <span class="wl-ex-data">${escapeHtml(formatExerciseLine(ex))}</span>
            </div>
          </div>
          ${renderVideoBox(ex.videoUrl, false)}
        </div>
      `).join('');

      const notesHtml = entry.notes ? `<div class="wl-notes">${escapeHtml(entry.notes)}</div>` : '';

      return `
        <div class="wl-entry ${isOpen ? 'wl-open' : ''}" data-id="${entry.id}">
          <div class="wl-entry-head" data-toggle="${entry.id}">
            <span class="wl-stamp ${allDone ? 'wl-stamp-done' : ''}">${stampText}</span>
            <div class="wl-entry-main">
              <p class="wl-entry-title">${escapeHtml(entry.title)}</p>
              <p class="wl-entry-sub">${escapeHtml(subLine)}</p>
            </div>
            <span class="wl-chevron">\u203a</span>
          </div>
          <div class="wl-entry-body">
            ${nextBanner}
            ${exerciseLines || '<div class="wl-notes">No exercises in this workout.</div>'}
            ${notesHtml}
            <div class="wl-entry-actions">
              <button class="wl-reset" data-reset="${entry.id}" type="button">Reset checklist</button>
              <button class="wl-delete" data-delete="${entry.id}" type="button">Delete workout</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    entriesEl.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        openEntryId = openEntryId === id ? null : id;
        renderEntries(currentEntries);
      });
    });
    entriesEl.querySelectorAll('[data-toggle-ex]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const entryEl = el.closest('.wl-entry');
        const entryId = entryEl.getAttribute('data-id');
        const entry = currentEntries.find((en) => en.id === entryId);
        const index = Number(el.getAttribute('data-toggle-ex'));
        toggleExercise(entry, index);
      });
    });
    entriesEl.querySelectorAll('[data-delete]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteWorkout(el.getAttribute('data-delete'));
      });
    });
    entriesEl.querySelectorAll('[data-reset]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const entryId = el.getAttribute('data-reset');
        const entry = currentEntries.find((en) => en.id === entryId);
        resetChecklist(entry);
      });
    });
  }

  async function loadEntries() {
    entriesEl.innerHTML = '<div class="wl-status">Loading workouts...</div>';
    try {
      const listResult = await window.storage.list('workout:');
      const keys = (listResult && listResult.keys) || [];
      const entries = [];
      for (const key of keys) {
        try {
          const res = await window.storage.get(key);
          if (res && res.value) {
            const parsed = JSON.parse(res.value);
            parsed.exercises = (parsed.exercises || []).map((ex) => ({ done: false, videoUrl: null, ...ex }));
            entries.push(parsed);
          }
        } catch (innerErr) {
          console.error('Failed to load entry', key, innerErr);
        }
      }
      renderEntries(entries);
    } catch (err) {
      console.error('Failed to list workouts', err);
      entriesEl.innerHTML = '<div class="wl-empty">Could not load your workouts. Refresh to try again.</div>';
    }
  }

  document.getElementById('wl-save').addEventListener('click', saveWorkout);

  loadEntries();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.error('Service worker registration failed', err);
      });
    });
  }
</script>
</body>
</html>
